# AlertManager Configuration
global:
  resolve_timeout: 5m

  # ===== EMAIL =====
  smtp_smarthost: 'smtp.gmail.com:587'        # Ou seu servidor SMTP
  smtp_auth_username: 'seu-email@gmail.com'   # Seu email
  smtp_auth_password: 'sua-senha-app'         # Senha de app (não a senha normal)
  smtp_from: 'alertas@sua-empresa.com'        # Email de origem

  # ===== TEAMS =====
  # Para Teams, use webhook_url abaixo nos receivers

# Definir templates de notificação
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Definir a rota principal
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s                    # Aguarda 10s antes de enviar (agrupa alertas)
  group_interval: 10s                # Intervalo entre grupos
  repeat_interval: 12h               # Reenviar alerta a cada 12h se ainda ativo
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h            # Críticos reenviam a cada 1h
      continue: true
    - match:
        severity: warning
      receiver: 'warning'
      repeat_interval: 4h            # Avisos reenviam a cada 4h

# Definir receptores
receivers:
  # ===== RECEIVER DEFAULT (Email) =====
  - name: 'default'
    email_configs:
      - to: 'seu-email@sua-empresa.com'
        from: '{{ .GroupLabels.AlertManager }}'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'seu-email@gmail.com'
        auth_password: 'sua-senha-app'
        headers:
          Subject: '[Alerta] {{ .GroupLabels.alertname }}'
        html: |
          <h2>{{ .GroupLabels.alertname }}</h2>
          <p><strong>Severidade:</strong> {{ .GroupLabels.severity }}</p>
          <p><strong>Instância:</strong> {{ .GroupLabels.instance }}</p>
          <hr>
          {{ range .Alerts }}
            <h3>{{ .Labels.alertname }}</h3>
            <p>{{ .Annotations.summary }}</p>
            <p><code>{{ .Annotations.description }}</code></p>
          {{ end }}

  # ===== RECEIVER CRÍTICO (Email + Teams) =====
  - name: 'critical'
    email_configs:
      - to: 'seu-email@sua-empresa.com,gerente@sua-empresa.com'
        from: 'alertas@sua-empresa.com'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'seu-email@gmail.com'
        auth_password: 'sua-senha-app'
        headers:
          Subject: '🚨 [CRÍTICO] {{ .GroupLabels.alertname }}'
        html: |
          <h1 style="color: red;">🚨 ALERTA CRÍTICO</h1>
          <h2>{{ .GroupLabels.alertname }}</h2>
          <p><strong>Instância:</strong> {{ .GroupLabels.instance }}</p>
          <hr>
          {{ range .Alerts }}
            <h3>{{ .Labels.alertname }}</h3>
            <p>{{ .Annotations.summary }}</p>
            <pre>{{ .Annotations.description }}</pre>
          {{ end }}
          <p><em>Resolvido em: {{ .GroupLabels.resolved }}</em></p>

    # Teams webhook - descomente e configure
    webhook_configs:
      - url: 'https://outlook.webhook.office.com/webhookb2/...'  # Seu Teams webhook
        send_resolved: true
        # Headers customizados se necessário
        # http_sd_configs: []

  # ===== RECEIVER AVISO (Email) =====
  - name: 'warning'
    email_configs:
      - to: 'seu-email@sua-empresa.com'
        from: 'alertas@sua-empresa.com'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'seu-email@gmail.com'
        auth_password: 'sua-senha-app'
        headers:
          Subject: '⚠️ [AVISO] {{ .GroupLabels.alertname }}'
        html: |
          <h2 style="color: orange;">⚠️ AVISO</h2>
          <h3>{{ .GroupLabels.alertname }}</h3>
          <p><strong>Instância:</strong> {{ .GroupLabels.instance }}</p>
          <hr>
          {{ range .Alerts }}
            <p>{{ .Annotations.summary }}</p>
          {{ end }}

# Definir grupos de inibição
inhibit_rules:
  # Não enviar aviso se houver um alerta crítico
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance', 'service']

  # Não enviar aviso se o serviço está down
  - source_match:
      alertname: 'ServiceDown'
    target_match:
      severity: 'warning'
    equal: ['instance']
