# Prometheus Configuration
global:
  scrape_interval: 15s        # Padrão: scrapear targets a cada 15 segundos
  evaluation_interval: 15s     # Padrão: avaliar regras a cada 15 segundos
  external_labels:
    monitor: 'robo-contratos-monitor'
    environment: 'production'

# Carregar arquivos de regras uma vez e periodicamente re-avaliar
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Configuração de scrape
scrape_configs:
  # Prometheus scrape config (auto-monitora a si mesmo)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Robo Contratos Transparência
  - job_name: 'robo-contratos'
    metrics_path: '/metrics'
    scrape_interval: 30s         # Scrapear robo contratos a cada 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ['robo-contratos-transparencia:8000']  # Nome do container
        labels:
          group: 'application'
          service: 'robo-contratos-transparencia'

  # Node Exporter (opcional - para métricas do sistema)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          group: 'infrastructure'
