# Grafana Configuration File

# Desabilitar Explore
[explore]
enabled = false

# Desabilitar Alerting (Unified Alerting)
[unified_alerting]
enabled = false

# Desabilitar AlertManager
[alertmanager]
enabled = false

# Desabilitar Help/Drilldown
[help]
enabled = false

# Desabilitar usuários anonymos e signup
[users]
allow_sign_up = false

# Ocultar itens do menu lateral
[sidebar]
enable_search_history = false

# Feature toggles para ocultar itens do menu
[feature_toggles]
disableBookmarksDrawer = true
disableStarred = true
disableDrilldown = true

# Timezone
[server]
root_url = http://localhost:3000/
