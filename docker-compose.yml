services:
  postgres:
    image: postgres:15-alpine
    container_name: observabilidade_logs_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: observabilidade_logs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: observabilidade_logs_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/observabilidade_logs
      APP_NAME: "Observabilidade Logs"
      DEBUG: "true"
      CRON_FILE: /host-cron.d/observabilidade
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app/backend:/app
      # Cron do host: na VM Ubuntu defina CRON_DIR=/etc/cron.d (ver .env).
      # Localmente usa ./data/cron.d para não tocar no cron real da máquina.
      - ${CRON_DIR:-./data/cron.d}:/host-cron.d
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: observabilidade_logs_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://backend:8000/api

volumes:
  postgres_data:

networks:
  default:
    name: observabilidade_network
